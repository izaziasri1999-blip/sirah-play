<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Login Admins SirahPlay</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F2E8D5] flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-lg w-96">
  <h2 class="text-2xl font-bold text-center mb-6 text-[#4A3728]">
    Login Admin 
  </h2>

<form id="loginForm" class="space-y-4">
  <input type="email" id="emailInput" placeholder="Email Admin"
    class="w-full p-3 border rounded-xl" required>

  <input type="password" id="passwordInput" placeholder="Password Admin"
    class="w-full p-3 border rounded-xl" required>

  <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 font-bold">
    Login Admin
  </button>

  <div class="relative flex py-2 items-center">
      <div class="flex-grow border-t border-gray-300"></div>
      <span class="flex-shrink mx-4 text-gray-400 text-sm">ATAU</span>
      <div class="flex-grow border-t border-gray-300"></div>
  </div>

  <a href="web.html" class="w-full block text-center bg-[#B8860B] text-white py-3 rounded-xl hover:bg-[#8B6508] transition font-bold">
    Masuk Sebagai Pelawat (Tanpa Login)
  </a>
</form>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAu8Ji5zO1YeAmN5vbNhF7Vg2Mx5In07-Q",
    authDomain: "sirahplay.firebaseapp.com",
    projectId: "sirahplay",
    storageBucket: "sirahplay.firebasestorage.app",
    appId: "1:52150333122:web:2f9f428b662e3a3af7155b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
// KOD YANG BETUL
const email = document.getElementById("emailInput").value; 
const password = document.getElementById("passwordInput").value;

    try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "admin.html"; // Pergi ke admin selepas berjaya
    } catch (err) {
        alert("Login gagal! Pastikan Email/Password betul di Firebase.");
        console.error(err);
    }
};
</script>
</body>
</html>
