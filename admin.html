<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SirahPlay Admin - Urus Kandungan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#F2E8D5] min-h-screen p-4 md:p-10">

    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-[#4A3728]">Dashboard Admin </h1>
            <p class="text-[#B8860B]">Uruskan Kuiz & Kisah Sirah </p>
        </div>

        <div class="grid grid-cols-1 gap-8">
            
            <section class="bg-white p-6 rounded-3xl shadow-lg border-l-8 border-blue-500">
                <h2 class="text-xl font-bold mb-4 text-blue-700"><i class="fas fa-book-open mr-2"></i>Tambah Kisah Sirah</h2>
                <form id="sirahForm" class="space-y-3">
                    <input type="text" id="s_title" placeholder="Tajuk (cth: Waktu Kecil Nabi)" class="w-full p-3 border rounded-xl" required>
                    <textarea id="s_summary" placeholder="Ringkasan pendek (untuk kad)" class="w-full p-3 border rounded-xl" required></textarea>
                    <textarea id="s_content" placeholder="Isi kandungan penuh (boleh guna <br> untuk baris baru)" class="w-full p-3 border rounded-xl h-32" required></textarea>
                    <input type="text" id="s_img" placeholder="Link Gambar (URL)" class="w-full p-3 border rounded-xl">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-xl hover:bg-blue-700">Simpan Kisah</button>
                </form>
            </section>

            <section class="bg-white p-6 rounded-3xl shadow-lg border-l-8 border-red-500">
                <h2 class="text-xl font-bold mb-4 text-red-700"><i class="fas fa-gamepad mr-2"></i>Tambah Soalan Kuiz</h2>
                <form id="quizForm" class="space-y-3">
                    <select id="q_cat" class="w-full p-3 border rounded-xl">
                        <option value="kecil">Kategori: Waktu Kecil</option>
                        <option value="remaja">Kategori: Waktu Remaja</option>
                        <option value="dakwah">Kategori: Dakwah</option>
                        <option value="akhir">Kategori: Akhir Hayat</option>
                    </select>
                    <input type="text" id="q_text" placeholder="Soalan" class="w-full p-3 border rounded-xl" required>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="ans0" placeholder="Pilihan A (Betul)" class="p-3 border border-green-300 rounded-xl bg-green-50" required>
                        <input type="text" id="ans1" placeholder="Pilihan B" class="p-3 border rounded-xl" required>
                        <input type="text" id="ans2" placeholder="Pilihan C" class="p-3 border rounded-xl" required>
                        <input type="text" id="ans3" placeholder="Pilihan D" class="p-3 border rounded-xl" required>
                    </div>
                    <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-xl hover:bg-red-700">Simpan Soalan</button>
                </form>
            </section>

            <div class="flex justify-end mb-4">
            <button id="logoutBtn" class="bg-gray-700 text-white px-4 py-2 rounded-xl hover:bg-black transition">
             <i class="fas fa-sign-out-alt mr-2"></i>Keluar
            </button>
            </div>

        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"; // Tambah signOut di sini
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAu8Ji5zO1YeAmN5vbNhF7Vg2Mx5In07-Q",
        authDomain: "sirahplay.firebaseapp.com",
        projectId: "sirahplay",
        storageBucket: "sirahplay.firebasestorage.app",
        messagingSenderId: "52150333122",
        appId: "1:52150333122:web:2f9f428b662e3a3af7155b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 🔐 PASTIKAN ADMIN LOGIN SEBELUM BOLEH SIMPAN
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "login.html";
        }
    });

    // --- 1. SIMPAN KISAH ---
    document.getElementById('sirahForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await addDoc(collection(db, "stories"), {
                title: document.getElementById('s_title').value,
                summary: document.getElementById('s_summary').value,
                content: document.getElementById('s_content').value,
                image: document.getElementById('s_img').value,
                timestamp: serverTimestamp()
            });
            alert("✅ Kisah berjaya disimpan!");
            e.target.reset();
        } catch (error) {
            alert("❌ Ralat: " + error.message);
        }
    });

    // --- 2. SIMPAN KUIZ ---
    document.getElementById('quizForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await addDoc(collection(db, "quizzes"), {
                category: document.getElementById('q_cat').value,
                q: document.getElementById('q_text').value,
                a: [
                    document.getElementById('ans0').value,
                    document.getElementById('ans1').value,
                    document.getElementById('ans2').value,
                    document.getElementById('ans3').value
                ],
                correct: 0,
                timestamp: serverTimestamp()
            });
            alert("✅ Soalan kuiz berjaya disimpan!");
            e.target.reset();
        } catch (error) {
            alert("❌ Ralat: " + error.message);
        }
    });

    // Fungsi Logout
document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut(auth).then(() => {
        alert("Anda telah berjaya keluar.");
        window.location.href = "login.html"; // Balik ke page login
    }).catch((error) => {
        alert("Ralat semasa keluar: " + error.message);
    });
});


</script>
</body>
</html>
